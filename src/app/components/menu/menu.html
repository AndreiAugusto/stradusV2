<aside class="sidebar">

  <div class="sidebar-brand">
    <i class="bi bi-truck-front-fill"></i>
    <span>Stradus</span>
  </div>

  <nav class="sidebar-nav">
    <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="sidebar-link">
      <i class="bi bi-speedometer2"></i>
      <span>Dashboard</span>
    </a>

    <div class="sidebar-section">Operações</div>

    <a routerLink="/frete" routerLinkActive="active" class="sidebar-link">
      <i class="bi bi-box-seam-fill"></i>
      <span>Fretes</span>
    </a>
    <a routerLink="/abastecimento" routerLinkActive="active" class="sidebar-link">
      <i class="bi bi-fuel-pump-fill"></i>
      <span>Abastecimentos</span>
    </a>
    <a routerLink="/manutencao" routerLinkActive="active" class="sidebar-link">
      <i class="bi bi-wrench-adjustable"></i>
      <span>Manutenções</span>
    </a>
    <a routerLink="/custo-fixo" routerLinkActive="active" class="sidebar-link">
      <i class="bi bi-receipt"></i>
      <span>Custos Fixos</span>
    </a>
    <a routerLink="/extrato" routerLinkActive="active" class="sidebar-link">
      <i class="bi bi-journal-text"></i>
      <span>Extrato</span>
    </a>

    <div class="sidebar-section">Cadastros</div>

    <a routerLink="/caminhao" routerLinkActive="active" class="sidebar-link">
      <i class="bi bi-truck"></i>
      <span>Caminhões</span>
    </a>
    <a routerLink="/motorista" routerLinkActive="active" class="sidebar-link">
      <i class="bi bi-person-badge-fill"></i>
      <span>Motoristas</span>
    </a>
    <a routerLink="/oficina" routerLinkActive="active" class="sidebar-link">
      <i class="bi bi-shop-window"></i>
      <span>Oficinas</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <button class="sidebar-link sidebar-logout" (click)="sair()">
      <i class="bi bi-box-arrow-right"></i>
      <span>Sair</span>
    </button>
  </div>

</aside>
