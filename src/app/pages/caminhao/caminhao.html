<div class="app-layout">
    <app-menu></app-menu>
    <main class="page-content">

        <div class="page-header d-flex justify-content-between align-items-center">
            <div>
                <h1>Caminhões</h1>
                <p class="page-subtitle">Gestão da frota</p>
            </div>
            <button class="btn btn-primary-custom" (click)="abrirNovo()">
                <i class="bi bi-plus-lg"></i> Adicionar Caminhão
            </button>
        </div>

        <div *ngIf="erro" class="alert alert-danger d-flex align-items-center gap-2">
            <i class="bi bi-exclamation-triangle-fill"></i>
            Erro ao carregar caminhões.
        </div>

        <div class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Placa</th>
                                <th>Modelo</th>
                                <th>Ano</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody *ngIf="!isLoading">
                            <tr *ngFor="let caminhao of caminhoes">
                                <td style="color: var(--color-text-muted)">{{ caminhao.id }}</td>
                                <td style="font-weight: 700; letter-spacing: 0.02em">{{ caminhao.placa }}</td>
                                <td>{{ caminhao.modelo }}</td>
                                <td>{{ caminhao.ano  | date:'dd/MM/yyyy':'':'pt-BR' }}</td>
                                <td>
                                    <button class="btn btn-sm btn-edit me-1" (click)="abrirEdicao(caminhao)">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <button class="btn btn-sm btn-danger" (click)="deletar(caminhao.id)">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            </tr>
                            <tr *ngIf="caminhoes.length === 0">
                                <td colspan="5" class="text-center py-4" style="color: var(--color-text-muted)">
                                    Nenhum caminhão cadastrado.
                                </td>
                            </tr>
                        </tbody>
                        <tbody *ngIf="isLoading">
                            <tr>
                                <td colspan="5" class="text-center py-4">
                                    <div class="spinner-border" style="color: var(--color-primary)" role="status">
                                        <span class="visually-hidden">Carregando...</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>
</div>

<!-- Modal de criação/edição -->
<div class="modal-overlay" *ngIf="showForm" (click)="fecharForm()">
  <div class="modal-panel" (click)="$event.stopPropagation()">
    <div class="modal-panel-header">
      <h5>{{ editandoId ? 'Editar Caminhão' : 'Adicionar Caminhão' }}</h5>
      <button type="button" class="btn-close-custom" (click)="fecharForm()">&times;</button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="modal-panel-body">
        <div class="mb-3">
          <label class="form-label">Modelo</label>
          <input type="text" class="form-control" formControlName="modelo" placeholder="Ex: DAF XF">
        </div>
        <div class="row">
          <div class="col-sm-6 mb-3">
            <label class="form-label">Ano</label>
            <input type="date" class="form-control" formControlName="ano">
          </div>
          <div class="col-sm-6 mb-3">
            <label class="form-label">Placa</label>
            <input type="text" class="form-control" formControlName="placa" placeholder="ABC-1234">
          </div>
        </div>
      </div>

      <div class="modal-panel-footer">
        <button type="button" class="btn btn-outline-secondary" (click)="fecharForm()">Cancelar</button>
        <button type="submit" class="btn btn-primary-custom" [disabled]="salvando">
          {{ salvando ? 'Salvando...' : 'Salvar' }}
        </button>
      </div>
    </form>
  </div>
</div>
