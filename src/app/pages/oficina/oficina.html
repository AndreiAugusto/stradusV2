<div class="app-layout">
    <app-menu></app-menu>
    <main class="page-content">

        <div class="page-header d-flex justify-content-between align-items-center">
            <div>
                <h1>Oficinas</h1>
                <p class="page-subtitle">Gestão de oficinas parceiras</p>
            </div>
            <button class="btn btn-primary-custom" (click)="abrirNovo()">
                <i class="bi bi-plus-lg"></i> Adicionar Oficina
            </button>
        </div>

        <div *ngIf="erro" class="alert alert-danger d-flex align-items-center gap-2">
            <i class="bi bi-exclamation-triangle-fill"></i>
            Erro ao carregar oficinas.
        </div>

        <div class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th>Nome da Oficina</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody *ngIf="!isLoading">
                            <tr *ngFor="let oficina of oficinas">
                                <td style="font-weight: 600; text-align: left !important">{{ oficina.nomeOficina }}</td>
                                <td>
                                    <button class="btn btn-sm btn-edit me-1" (click)="abrirEdicao(oficina)">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <button class="btn btn-sm btn-danger" (click)="deletar(oficina.id)">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            </tr>
                            <tr *ngIf="oficinas.length === 0">
                                <td colspan="2" class="text-center py-4" style="color: var(--color-text-muted)">
                                    Nenhuma oficina cadastrada.
                                </td>
                            </tr>
                        </tbody>
                        <tbody *ngIf="isLoading">
                            <tr>
                                <td colspan="2" class="text-center py-4">
                                    <div class="spinner-border" style="color: var(--color-primary)" role="status">
                                        <span class="visually-hidden">Carregando...</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>
</div>

<!-- Modal de criação/edição -->
<div class="modal-overlay" *ngIf="showForm" (click)="fecharForm()">
  <div class="modal-panel" (click)="$event.stopPropagation()">
    <div class="modal-panel-header">
      <h5>{{ editandoId ? 'Editar Oficina' : 'Adicionar Oficina' }}</h5>
      <button type="button" class="btn-close-custom" (click)="fecharForm()">&times;</button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="modal-panel-body">
        <div class="mb-3">
          <label class="form-label">Nome da Oficina</label>
          <input type="text" class="form-control" formControlName="nomeOficina" placeholder="Ex: Posto Miriam">
        </div>
      </div>

      <div class="modal-panel-footer">
        <button type="button" class="btn btn-outline-secondary" (click)="fecharForm()">Cancelar</button>
        <button type="submit" class="btn btn-primary-custom" [disabled]="salvando">
          <span *ngIf="salvando" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          {{ salvando ? 'Salvando...' : 'Salvar' }}
        </button>
      </div>
    </form>
  </div>
</div>
