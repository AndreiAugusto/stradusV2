<div class="app-layout">
    <app-menu></app-menu>
    <main class="page-content">

        <div class="page-header d-flex justify-content-between align-items-center">
            <div>
                <h1>Motoristas</h1>
                <p class="page-subtitle">Gestão de motoristas cadastrados</p>
            </div>
            <button class="btn btn-primary-custom">
                <i class="bi bi-plus-lg"></i> Adicionar Motorista
            </button>
        </div>

        <div *ngIf="erro" class="alert alert-danger d-flex align-items-center gap-2">
            <i class="bi bi-exclamation-triangle-fill"></i>
            Erro ao carregar motoristas.
        </div>

        <div class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Nome</th>
                                <th>Nascimento</th>
                                <th>Nº Carteira</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody *ngIf="!isLoading">
                            <tr *ngFor="let motorista of motoristas">
                                <td style="color: var(--color-text-muted)">{{ motorista.id }}</td>
                                <td style="font-weight: 600">{{ motorista.nomeMotorista }}</td>
                                <td>{{ motorista.nascimento | date:'dd/MM/yyyy':'':'pt-BR' }}</td>
                                <td>{{ motorista.nCarteira || '—' }}</td>
                                <td>
                                    <button class="btn btn-sm btn-edit me-1">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <button class="btn btn-sm btn-danger" (click)="deletar(motorista.id)">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            </tr>
                            <tr *ngIf="motoristas.length === 0">
                                <td colspan="5" class="text-center py-4" style="color: var(--color-text-muted)">
                                    Nenhum motorista cadastrado.
                                </td>
                            </tr>
                        </tbody>
                        <tbody *ngIf="isLoading">
                            <tr>
                                <td colspan="5" class="text-center py-4">
                                    <div class="spinner-border" style="color: var(--color-primary)" role="status">
                                        <span class="visually-hidden">Carregando...</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>
</div>
